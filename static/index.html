<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MTA Live Arrivals</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fdf8ec;
    --card-bg: #fffdf7;
    --text: #241f1a;
    --muted: #83786b;
    --ink: #241f1a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171310;
      --card-bg: #221d18;
      --text: #f4ecdf;
      --muted: #a89c8b;
      --ink: #f4ecdf;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2.5rem 1rem 4rem;
    background:
      radial-gradient(circle at 8% 12%, rgba(238,53,46,0.07) 0, transparent 45%),
      radial-gradient(circle at 92% 88%, rgba(167,169,172,0.15) 0, transparent 45%),
      var(--bg);
    color: var(--text);
    font-family: "Chalkboard SE", "Comic Sans MS", "Marker Felt", -apple-system, sans-serif;
  }
  h1 {
    text-align: center;
    font-size: 2.1rem;
    margin: 0 0 0.1rem;
    letter-spacing: 0.5px;
    transform: rotate(-1.5deg);
  }
  h1 .choo {
    display: inline-block;
    animation: chug 1.4s ease-in-out infinite;
  }
  @keyframes chug {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-4px) rotate(-6deg); }
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 0.5rem;
    font-style: italic;
  }
  #updated {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin-bottom: 1.5rem;
  }
  .search-wrap {
    position: relative;
    max-width: 420px;
    margin: 0 auto 2.5rem;
  }
  #station-search {
    width: 100%;
    padding: 0.7rem 1rem;
    border-radius: 999px;
    border: 3px dashed var(--muted);
    background: var(--card-bg);
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    outline: none;
  }
  #station-search:focus {
    border-color: var(--ink);
  }
  .search-results {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--card-bg);
    border: 3px solid var(--ink);
    border-radius: 14px;
    box-shadow: 5px 5px 0 var(--ink);
    padding: 0.5rem;
    z-index: 10;
    max-height: 320px;
    overflow-y: auto;
  }
  .search-results:empty { display: none; }
  .search-result {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.45rem 0.5rem;
    border-radius: 8px;
    gap: 0.5rem;
  }
  .search-result:hover { background: var(--bg); }
  .search-result-name {
    font-size: 0.9rem;
  }
  .search-result-routes {
    display: flex;
    gap: 0.3rem;
    flex-shrink: 0;
  }
  .route-chip {
    width: 1.6rem;
    height: 1.6rem;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: transform 0.1s ease;
  }
  .route-chip:hover { transform: scale(1.15); }
  .remove-btn {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.1rem;
    cursor: pointer;
    line-height: 1;
    padding: 0 0.2rem;
  }
  .remove-btn:hover { color: var(--route-color, var(--ink)); }
  .live-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2ecc71;
    margin-right: 5px;
    animation: pulse 1.2s ease-in-out infinite;
    vertical-align: middle;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.7); }
  }
  .grid {
    display: grid;
    gap: 2rem 1.5rem;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    max-width: 980px;
    margin: 0 auto;
  }
  .card {
    position: relative;
    background: var(--card-bg);
    border: 3px solid var(--route-color, var(--ink));
    border-radius: 16px;
    padding: 1.4rem 1.4rem 1.2rem;
    box-shadow: 6px 6px 0 var(--route-color, var(--ink));
    transform: rotate(var(--tilt, 0deg));
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card:nth-child(3n+1) { --tilt: -1.2deg; }
  .card:nth-child(3n+2) { --tilt: 0.9deg; }
  .card:nth-child(3n+3) { --tilt: -0.5deg; }
  .card:hover {
    transform: rotate(0deg) translateY(-3px);
    box-shadow: 9px 9px 0 var(--route-color, var(--ink));
  }
  .card::before {
    content: "";
    position: absolute;
    top: -9px;
    left: -9px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--bg);
    border: 3px solid var(--route-color, var(--ink));
  }
  .card h2 {
    margin: 0 0 0.9rem 0;
    font-size: 1.15rem;
    display: flex;
    align-items: center;
  }
  .card h2 .station-name {
    flex: 1;
  }
  .route-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2rem;
    height: 2rem;
    border-radius: 50%;
    background: var(--route-color, #888);
    color: white;
    font-weight: 700;
    font-size: 1.05rem;
    margin-right: 0.6rem;
    box-shadow: 0 2px 0 rgba(0,0,0,0.25) inset;
    flex-shrink: 0;
  }
  .direction {
    margin-top: 0.9rem;
    padding-top: 0.7rem;
    border-top: 2px dashed color-mix(in srgb, var(--route-color, var(--muted)) 40%, transparent);
  }
  .direction:first-of-type {
    border-top: none;
    padding-top: 0;
  }
  .direction-label {
    color: var(--muted);
    font-size: 0.82rem;
    margin-bottom: 0.4rem;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-weight: 700;
  }
  .arrival-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
  }
  .pill {
    background: var(--bg);
    border: 2px dashed var(--muted);
    border-radius: 999px;
    padding: 0.3rem 0.75rem;
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .pill.soon {
    color: white;
    background: var(--route-color, var(--ink));
    border-style: solid;
    border-color: var(--route-color, var(--ink));
    animation: wiggle 2s ease-in-out infinite;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-3deg); }
    75% { transform: rotate(3deg); }
  }
  .empty {
    color: var(--muted);
    font-size: 0.85rem;
    font-style: italic;
  }
</style>
</head>
<body>
  <h1><span class="choo">🚇</span> MTA Live Arrivals</h1>
  <div class="subtitle">no maps, just vibes &amp; countdowns</div>
  <div id="updated">loading…</div>
  <div class="search-wrap">
    <input id="station-search" type="text" placeholder="add a station… (e.g. Times Sq)" autocomplete="off" />
    <div class="search-results" id="search-results"></div>
  </div>
  <div class="grid" id="grid"></div>

  <script>
    const POLL_MS = 15000;
    let ROUTE_COLORS = {};

    function routeColor(route) {
      return (ROUTE_COLORS[route] && ROUTE_COLORS[route].color) || "#888";
    }

    function routeTextColor(route) {
      return (ROUTE_COLORS[route] && ROUTE_COLORS[route].text_color) || "white";
    }

    function formatCountdown(epoch) {
      const secondsLeft = Math.round(epoch - Date.now() / 1000);
      if (secondsLeft <= 0) return "due 🐇";
      const m = Math.floor(secondsLeft / 60);
      const s = secondsLeft % 60;
      return `${m}:${String(s).padStart(2, "0")}`;
    }

    function render(data) {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      for (const station of data.stations) {
        const color = routeColor(station.route);
        const card = document.createElement("div");
        card.className = "card";
        card.style.setProperty("--route-color", color);

        const heading = document.createElement("h2");
        const badge = document.createElement("span");
        badge.className = "route-badge";
        badge.textContent = station.route;
        badge.style.color = routeTextColor(station.route);
        heading.appendChild(badge);

        const name = document.createElement("span");
        name.className = "station-name";
        name.textContent = station.name;
        heading.appendChild(name);

        const removeBtn = document.createElement("button");
        removeBtn.className = "remove-btn";
        removeBtn.textContent = "✕";
        removeBtn.title = "remove station";
        removeBtn.addEventListener("click", () => removeStation(station.stop_id, station.route));
        heading.appendChild(removeBtn);

        card.appendChild(heading);

        for (const [dir, info] of Object.entries(station.directions)) {
          const block = document.createElement("div");
          block.className = "direction";

          const label = document.createElement("div");
          label.className = "direction-label";
          label.textContent = info.label;
          block.appendChild(label);

          const list = document.createElement("div");
          list.className = "arrival-list";
          if (info.arrivals.length === 0) {
            const empty = document.createElement("span");
            empty.className = "empty";
            empty.textContent = "no data — shrug emoji";
            list.appendChild(empty);
          } else {
            info.arrivals.forEach((a, i) => {
              const pill = document.createElement("span");
              pill.className = "pill" + (i === 0 ? " soon" : "");
              pill.dataset.epoch = a.arrival_epoch;
              pill.textContent = formatCountdown(a.arrival_epoch);
              list.appendChild(pill);
            });
          }
          block.appendChild(list);
          card.appendChild(block);
        }

        grid.appendChild(card);
      }
    }

    function tickCountdowns() {
      document.querySelectorAll(".pill[data-epoch]").forEach((pill) => {
        pill.textContent = formatCountdown(Number(pill.dataset.epoch));
      });
    }

    async function poll() {
      try {
        const res = await fetch("/api/arrivals");
        const data = await res.json();
        render(data);
        document.getElementById("updated").innerHTML =
          '<span class="live-dot"></span>updated ' +
          new Date(data.generated_at * 1000).toLocaleTimeString();
      } catch (err) {
        document.getElementById("updated").textContent = "error fetching data";
        console.error(err);
      }
    }

    async function removeStation(stopId, route) {
      await fetch("/api/stations", {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ stop_id: stopId, route: route }),
      });
      poll();
    }

    async function addStation(stopId, route) {
      await fetch("/api/stations", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ stop_id: stopId, route: route }),
      });
      document.getElementById("station-search").value = "";
      document.getElementById("search-results").innerHTML = "";
      poll();
    }

    let searchDebounce;
    document.getElementById("station-search").addEventListener("input", (e) => {
      clearTimeout(searchDebounce);
      const query = e.target.value.trim();
      searchDebounce = setTimeout(async () => {
        const resultsEl = document.getElementById("search-results");
        if (query.length < 2) {
          resultsEl.innerHTML = "";
          return;
        }
        const res = await fetch("/api/search?q=" + encodeURIComponent(query));
        const matches = await res.json();
        resultsEl.innerHTML = "";
        matches.forEach((m) => {
          const row = document.createElement("div");
          row.className = "search-result";

          const name = document.createElement("span");
          name.className = "search-result-name";
          name.textContent = m.name;
          row.appendChild(name);

          const routesWrap = document.createElement("span");
          routesWrap.className = "search-result-routes";
          m.routes.forEach((route) => {
            const chip = document.createElement("button");
            chip.className = "route-chip";
            chip.textContent = route;
            chip.style.background = routeColor(route);
            chip.style.color = routeTextColor(route);
            chip.addEventListener("click", () => addStation(m.stop_id, route));
            routesWrap.appendChild(chip);
          });
          row.appendChild(routesWrap);

          resultsEl.appendChild(row);
        });
      }, 250);
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-wrap")) {
        document.getElementById("search-results").innerHTML = "";
      }
    });

    async function init() {
      const res = await fetch("/api/routes");
      ROUTE_COLORS = await res.json();
      poll();
    }

    init();
    setInterval(poll, POLL_MS);
    setInterval(tickCountdowns, 1000);
  </script>
</body>
</html>
